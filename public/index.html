<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#F8F8FA" />
    <meta
      name="description"
      content="Maria Shmakova — UX/UI Designer & Frontend Developer. Interfaces that feel alive: product design, React development and creative coding."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Maria Shmakova — UX/UI Designer & Frontend Developer</title>
    <script>
      // Must run before the bundle: React Router reads window.location on boot.
      (function (l) {
        // Restore a path that 404.html encoded as "/?/project/loop".
        if (l.search.charAt(1) === "/") {
          var path = l.search
            .slice(1)
            .split("&")
            .map(function (part) {
              return part.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(null, "", path + l.hash);
          return;
        }
        // Send links shared before the switch to BrowserRouter ("/#/project/loop")
        // to their new clean equivalent.
        if (l.hash.slice(0, 2) === "#/") {
          window.history.replaceState(null, "", l.hash.slice(1));
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
